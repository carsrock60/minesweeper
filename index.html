<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquifer - Modern Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="logo">Aquifer</h1>
        <p class="subtitle">A clean, modern Minesweeper experience.</p>

        <div class="game-modes">
            <button>Easy</button>
            <button>Medium</button>
            <button>Hard</button>
        </div>

        <ul class="features-list">
            <li>Precision Stopwatch (0.01s)</li>
            <li>First-Click Safety</li>
            <li>Chording Support</li>
            <li>Mine Counter</li>
        </ul>

        <div class="status-bar">
            Time: <span id="timer">0.00</span>s | Mines: <span id="mine-count">0</span>
        </div>
    </div>

    <script>
        console.log("Aquifer initialized.");
    </script>
</body>
</html>
